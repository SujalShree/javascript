<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Key Listener</title>
</head>
<body>
    <main class="app">
        <h1>Keyboard Listener</h1>
        <p class="hint">Press any key and the page will show the key, code, and value.</p>

        <section class="panel">
            <div class="card">
                <span class="label">Key</span>
                <strong id="keyValue">-</strong>
            </div>
            <div class="card">
                <span class="label">Code</span>
                <strong id="codeValue">-</strong>
            </div>
            <div class="card">
                <span class="label">Value</span>
                <strong id="valueValue">-</strong>
            </div>
        </section>
    </main>
</body>
</html>
