<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="canvas">
        <h1>Color Switcher</h1>
        <h3>Welcome to the Color Switcher. Please choose the color of your choice and see the magic happen!</h3>
        <div class="color-options">
            <div class="red">
                <button class="btn btn-danger">Change to Red</button>
            </div>
            <div class="green">
                <button class="btn btn-success">Change to Green</button>
            </div>
            <div class="blue">
                <button class="btn btn-primary">Change to Blue</button>
            </div>
            <div class="yellow">
                <button class="btn btn-warning">Change to Yellow</button>
            </div>
            <div class="sky-blue">
                <button class="btn btn-info">Change to Sky Blue</button>
            </div>
        </div>
        <p>Have fun fellas!</p>
    </div>
</body>
</html>
