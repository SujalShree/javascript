<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <h1 class="heading">Sujal's Calculator</h1>
    <div class="container">
        <div class="display">
            <input type="text" class="input">
        </div>
        <div class="row">
            <button class="btn"><i class="fa-solid fa-delete-left"></i></button>
            <button class="btn">AC</button>
            <button class="btn">%</button>
            <button class="btn btn-last"><i class="fa-solid fa-divide"></i></button>
        </div>
        <div class="row">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn btn-last"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="row">
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn btn-last"><i class="fa-solid fa-minus"></i></button>
        </div>
        <div class="row">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn btn-last"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="row-last">
            <button class="btn-one">0</button>
            <button class="btn">.</button>
            <button class="btn btn-last"><i class="fa-solid fa-equals"></i></button>
        </div>
    </div>
</body>
</html>
